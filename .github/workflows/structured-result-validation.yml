name: Structured result record validation

on:
  pull_request:
    paths:
      - "docs/schemas/**"
      - "docs/RESEARCH_TASK_HANDOFF_STANDARD.md"
      - "docs/RESEARCH_TASK_HANDOFF_STANDARD.zh-CN.md"
      - "docs/governance/DOWNSTREAM_STANDARDS_ADOPTION.md"
      - "docs/governance/DOWNSTREAM_STANDARDS_ADOPTION.zh-CN.md"
      - "templates/research-task-brief.md"
      - "templates/research-task-brief.zh-CN.md"
      - "docs/STRUCTURED_RESULT_DATA_STANDARD.md"
      - "docs/STRUCTURED_RESULT_DATA_STANDARD.zh-CN.md"
      - "docs/STRUCTURED_RESULT_DATA_STANDARD_v1.0.1.md"
      - "docs/STRUCTURED_RESULT_DATA_STANDARD_v1.0.1.zh-CN.md"
      - "docs/RESEARCH_TASK_HANDOFF_STANDARD.md"
      - "docs/RESEARCH_TASK_HANDOFF_STANDARD.zh-CN.md"
      - "docs/governance/DOWNSTREAM_STANDARDS_ADOPTION.md"
      - "docs/governance/DOWNSTREAM_STANDARDS_ADOPTION.zh-CN.md"
      - "templates/research-task-brief.md"
      - "templates/research-task-brief.zh-CN.md"
      - ".github/workflows/structured-result-validation.yml"
  push:
    branches:
      - main
    paths:
      - "docs/schemas/**"
      - "docs/STRUCTURED_RESULT_DATA_STANDARD.md"
      - "docs/STRUCTURED_RESULT_DATA_STANDARD.zh-CN.md"
      - "docs/STRUCTURED_RESULT_DATA_STANDARD_v1.0.1.md"
      - "docs/STRUCTURED_RESULT_DATA_STANDARD_v1.0.1.zh-CN.md"
      - ".github/workflows/structured-result-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned validation dependency
        run: python -m pip install -r docs/schemas/requirements-result-validation.txt -r docs/schemas/requirements-standards-adoption.txt

      - name: Run structured-result regression tests
        run: python -m unittest discover -s docs/schemas/tests -v

      - name: Run standards-adoption regression tests
        run: python -m unittest discover -s docs/schemas/tests -p "test_standards_adoption.py" -v

      - name: Compile validator
        run: python -m compileall -q docs/schemas
