name: Candidate schema validation

on:
  pull_request:
  push:
    branches:
      - main
      - "bootstrap/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schema-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Record and validate the exact PR head, not the synthetic merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # The checked-in report is a historical snapshot. Never upload it as if
      # it were generated by this run if validation never starts.
      - name: Remove historical validation report
        run: rm -f schema/v1.4.3.7/audit/validation-report.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned validation dependency
        run: python -m pip install -r requirements-dev.txt

      - name: Validate schemas, fixtures, and traceability
        env:
          SCHEMA_VALIDATED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python schema/v1.4.3.7/tools/schema-v1.4.3.6-validate.py schema/v1.4.3.7

      - name: Verify generated evidence provenance
        env:
          SCHEMA_VALIDATED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          root = Path("schema/v1.4.3.7")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          report = json.loads((root / "audit/validation-report.json").read_text(encoding="utf-8"))
          provenance = report.get("provenance", {})
          summary = report.get("summary", {})
          expected_sha = os.environ.get("SCHEMA_VALIDATED_HEAD_SHA")
          expected_run_id = os.environ.get("GITHUB_RUN_ID")
          expected_run_attempt = os.environ.get("GITHUB_RUN_ATTEMPT")
          validator_path = root / "tools/schema-v1.4.3.6-validate.py"
          errors = []

          if provenance.get("validation_status") != "passed":
              errors.append("validator report does not declare validation_status=passed")
          if provenance.get("validated_commit_sha") != expected_sha:
              errors.append("report SHA does not match the PR head being validated")
          if provenance.get("workflow_run_id") != expected_run_id:
              errors.append("report workflow_run_id does not match this Actions run")
          if provenance.get("workflow_run_attempt") != expected_run_attempt:
              errors.append("report workflow_run_attempt does not match this Actions attempt")
          if provenance.get("validator_sha256") != hashlib.sha256(validator_path.read_bytes()).hexdigest():
              errors.append("report validator_sha256 does not match the checked validator")
          if provenance.get("manifest_sha256") != hashlib.sha256((root / "manifest.json").read_bytes()).hexdigest():
              errors.append("report manifest_sha256 does not match the checked manifest")
          if provenance.get("traceability_csv_sha256") != hashlib.sha256((root / "audit/requirement-test-trace.csv").read_bytes()).hexdigest():
              errors.append("report traceability_csv_sha256 does not match the checked traceability CSV")
          if provenance.get("execution_environment") != "github_actions":
              errors.append("report does not identify GitHub Actions as its execution environment")
          if summary.get("checks_failed") != 0:
              errors.append("validator reports failed checks")
          if summary.get("trace_rows") != manifest.get("requirement_traceability_rows"):
              errors.append("report traceability row count does not match manifest")
          if manifest.get("release_evidence", {}).get("traceability_rows") != manifest.get("requirement_traceability_rows"):
              errors.append("manifest traceability row counts are inconsistent")

          if errors:
              print("\n".join(f"ERROR: {item}" for item in errors))
              sys.exit(1)

          print(json.dumps({
              "validated_commit_sha": provenance["validated_commit_sha"],
              "workflow_run_id": provenance["workflow_run_id"],
              "validator_sha256": provenance["validator_sha256"],
              "checks": summary.get("checks_total"),
              "trace_rows": summary.get("trace_rows"),
          }, indent=2))
          PY

      - name: Upload candidate schema validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-schema-validation-report
          path: schema/v1.4.3.7/audit/validation-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Run candidate integration tests
        run: python schema/v1.4.3.7/tests/integration/test_v1_4_3_7.py

      - name: Test Skill scaffold
        run: python -m unittest discover -s tests/unit -v

      - name: Compile candidate Python tools and physics pilot
        run: python -m compileall -q schema/v1.4.3.7/tools skills/high-energy-theory-research/scripts tests/eval-cases/uv-eFT-hard-derivative-pilot

      - name: Build and validate real UV-EFT research-task bundle
        run: python tests/eval-cases/uv-eFT-hard-derivative-pilot/run_record_chain.py --output-dir "$RUNNER_TEMP/uv-eFT-hard-derivative-bundle"

      - name: Upload real research-task provenance bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: uv-eFT-hard-derivative-provenance-bundle
          path: ${{ runner.temp }}/uv-eFT-hard-derivative-bundle
          if-no-files-found: error
          retention-days: 30
