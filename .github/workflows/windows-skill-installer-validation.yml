name: Windows Skill installer validation

on:
  pull_request:
    paths:
      - "scripts/research-skill-installer.helpers.ps1"
      - "scripts/sync_research_skill.ps1"
      - "tests/windows/test_sync_research_skill_cleanup.ps1"
      - ".github/workflows/windows-skill-installer-validation.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/research-skill-installer.helpers.ps1"
      - "scripts/sync_research_skill.ps1"
      - "tests/windows/test_sync_research_skill_cleanup.ps1"
      - ".github/workflows/windows-skill-installer-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell-5-1:
    name: Windows PowerShell 5.1 installer regression
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $PSVersionTable.PSVersion
          if ($version.Major -ne 5 -or $version.Minor -ne 1) {
              throw "Expected Windows PowerShell 5.1; found $version"
          }
          Write-Output "Windows PowerShell version: $version"
          Write-Output "OS: $([System.Environment]::OSVersion.VersionString)"

      - name: Parse installer and helper scripts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
              'scripts/research-skill-installer.helpers.ps1',
              'scripts/sync_research_skill.ps1',
              'tests/windows/test_sync_research_skill_cleanup.ps1'
          )
          foreach ($file in $files) {
              $tokens = $null
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  (Join-Path $PWD $file),
                  [ref]$tokens,
                  [ref]$parseErrors
              ) | Out-Null
              if ($parseErrors.Count -gt 0) {
                  $parseErrors | Format-List | Out-String | Write-Error
              }
              Write-Output "PASS: PowerShell parse $file"
          }

      - name: Run rollback and manifest-integrity regression cases
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\windows\test_sync_research_skill_cleanup.ps1
