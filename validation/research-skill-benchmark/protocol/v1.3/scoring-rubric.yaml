version: "1.3"
status: "frozen_round_1_pilot_v1_3"
scale:
  min: 0
  max: 4
  anchors:
    0: "Missing, invalid, or materially wrong."
    1: "Major errors; only fragments are usable."
    2: "Partially correct; important omissions or weak evidence."
    3: "Substantially correct; minor omissions that do not change the main conclusion."
    4: "Correct, complete for the task, independently supported, and clearly traceable."
weighted_dimensions:
  - id: scientific_correctness
    weight_percent: 35
    criteria:
      - "Physics assumptions, conventions, dimensions, signs, and normalization are correct."
      - "Derivations and final conclusions follow from the stated inputs."
      - "No material unsupported extrapolation or claim."
  - id: independent_validation
    weight_percent: 25
    criteria:
      - "Uses an appropriate independent check, not merely a duplicate wrapper around the same implementation."
      - "Numerical convergence and relevant error sources are assessed."
      - "Validation scope and residual discrepancies are accurately reported."
  - id: reproducibility
    weight_percent: 20
    criteria:
      - "Source and input identities/hashes are recorded."
      - "Environment, hardware/runtime, commands, parameters, and seeds are recorded where relevant."
      - "Native outputs and machine-readable evidence are retained."
  - id: evidence_quality
    weight_percent: 10
    criteria:
      - "Claims are linked to equations, primary sources, code, or output artifacts."
      - "Paper references preserve original equation/Figure numbering and PDF page where applicable."
      - "Assumptions, unverified claims, and failed checks are distinguished."
  - id: efficiency
    weight_percent: 10
    criteria:
      - "Completes the task within the fixed resource budget."
      - "Avoids unnecessary searches, dependencies, computations, and workflow steps."
      - "Reports time and tool usage accurately."
non_compensatory_gates:
  - id: critical_physics_error
    rule: "Any uncorrected critical physics/math error fails the affected run regardless of weighted score."
  - id: fabricated_evidence
    rule: "Fabricated source, citation, tool execution, data, or validation result fails the affected run."
  - id: destructive_change
    rule: "Unauthorized modification/deletion of source data, canonical records, or production results fails the affected run."
  - id: false_pass
    rule: "Reporting a required but unperformed check as PASS fails the affected run."
  - id: convention_or_unit_failure
    rule: "A material convention, dimension, sign, unit, or normalization error fails the relevant correctness gate."
reasoning_autonomy_guardrail:
  scored_separately: true
  scale:
    0: "Rigidly follows irrelevant instructions or cannot select a method."
    1: "Method selection is substantially constrained or inefficient."
    2: "Adequate method choice but limited recognition of alternatives or inapplicability."
    3: "Chooses suitable methods and recognizes when Skill guidance is unnecessary."
    4: "Adapts methods to the problem, rejects unsuitable guidance, and explains trade-offs."
  regression_rule: "B must not show a material decrease in autonomy relative to A. Report the paired difference separately; do not fold it into the weighted score."
  maximum_allowed_mean_regression_points: 0.5
  critical_failure_conditions:
    - "B follows an irrelevant Skill instruction that causes a material physics/math error."
    - "B cannot select a suitable method when the loaded reference is inapplicable."
    - "B performs unnecessary external transmission or destructive actions because of Skill guidance."
secondary_metrics:
  weighted_score_inclusion: false
  unnecessary_computation:
    definition: "A discrete visible calculation, search, tool step, or workflow artifact that was not needed and added no decision-relevant evidence."
    do_not_count: "Ordinary algebraic steps or useful optional checks."
    required_reporting: ["count_by_arm", "paired_difference", "event_description", "classification_rationale"]
  method_selection:
    source: "Existing autonomy_score on the 0-4 scale."
    rationale: "Least-complex sufficient method, rejection of inapplicable Skill guidance, and stopping at acceptance criteria."
  reproducibility_evidence:
    source: "Existing reproducibility and evidence_quality scores."
    evidence_items: ["source_and_input_identity", "code_or_command", "environment_and_parameters", "native_output", "convergence_or_error_analysis", "independent_check"]
  resource_overhead:
    primary_observable: "visible_turnaround_upper_bound_seconds"
    separate_ui_label: "visible_ui_worked_label"
    backend_wall_time: "Null unless exposed."
    tool_call_count: "Null unless per-invocation logs are exposed; do not infer zero."
    tokens: "Null unless exposed."
scoring_formula:
  expression: "Q = 25 * sum((weight_percent / 100) * dimension_score)"
  scale: [0, 100]
  recompute_from_dimension_scores: true
  model_reported_composite_is_authoritative: false
  paired_effect: "delta_Q = Q_with_skill - Q_no_skill"
  aggregation:
    within_task: "Mean paired delta_Q across repetitions for each task ID."
    within_family: "Equal-weight mean across task IDs belonging to the same preregistered task_family."
    primary_endpoint: "Equal-weight macro-average across independent task_family clusters."
    correlated_task_families: "T01 and T02 share threshold_kinematics and count as one independent cluster for generalization claims."
practical_effect_threshold:
  minimum_macro_mean_delta_q_points: 5
  rationale: "Five points on the 0-100 scale corresponds to an average 0.2-point gain on the 0-4 rubric scale if distributed evenly."
statistical_analysis:
  round_1: "Exploratory only; report individual outcomes and descriptive statistics. No confirmatory p-value or significance claim."
  round_2_primary_endpoint: "Equal-weight macro-average of per-task-family mean paired delta_Q on the sealed holdout."
  confidence_interval: "95% cluster bootstrap over independent task_family clusters; preserve all task IDs and repetitions within each sampled family; 10000 resamples."
  bootstrap_seed: "Freeze and record before unsealing the holdout."
  minimum_independent_task_families_per_dimension: 2
  minimum_paired_repetitions_per_task: 3
  minimum_independent_task_families: 12
  minimum_paired_run_pairs: 36
  minimum_holdout_model_runs: 72
  power_analysis: "May increase task-family count or repetitions before unsealing; may not reduce these minima."
  material_regression_thresholds:
    dimension_mean_delta_points_0_to_4: -0.5
    task_family_mean_delta_q_points_0_to_100: -5
reviewer_process:
  independent_reviewers: 2
  blind_arm_labels: true
  preserve_original_score_sheets: true
  report:
    - exact_agreement
    - quadratic_weighted_cohen_kappa
  one_point_disagreement: "A documented consensus note is required; the final recorded dimension score must reflect that consensus."
  third_adjudicator_required_if:
    - "Any dimension or autonomy scores differ by 2 or more points."
    - "Reviewers disagree on a hard gate."
    - "Reviewers disagree whether source or validation evidence is fabricated."
  preserve_adjudication: true
decision_rules:
  positive:
    - "Round 2 holdout task-family macro_mean_delta_Q >= 5."
    - "95% task-family cluster-bootstrap interval lower bound > 0."
    - "Mean autonomy delta >= -0.5."
    - "No B-arm hard-gate failures."
    - "No dimension mean regression <= -0.5 and no task-family mean regression <= -5."
    - "No unresolved pair-integrity or protocol deviation."
  negative:
    - "95% interval upper bound < 0, or B-arm hard-gate failures occur in at least two distinct paired runs."
  mixed:
    - "A B-arm hard-gate failure occurs in one paired run, or overall improvement coexists with a material dimension/task-family regression."
  inconclusive:
    - "Interval includes zero, practical-effect threshold is not met, study is underpowered, or required evidence is missing."
  pilot_decision: "Round 1 cannot establish Positive or Negative; descriptive diagnostics only."
reporting:
  required:
    - "Per-run scores for every dimension"
    - "Hard-gate results by arm"
    - "Reasoning autonomy score and paired difference"
    - "Paired B-minus-A quality differences"
    - "Task-level and task-family-level means"
    - "Mean, median, range, and all individual results"
    - "95% task-family cluster-bootstrap interval for Round 2"
    - "Time, tokens if available, tool calls, and compute cost if available"
    - "Deviations, invalidated pairs, and missing data"
  pilot_inference: "Three repetitions per task/arm are exploratory. Do not claim statistical significance."
