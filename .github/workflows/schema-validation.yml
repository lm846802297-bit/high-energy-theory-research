name: Candidate schema validation

on:
  pull_request:
  push:
    branches:
      - main
      - "bootstrap/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned validation dependency
        run: python -m pip install -r requirements-dev.txt

      - name: Validate schemas, fixtures, and traceability
        run: python schema/v1.4.3.7/tools/schema-v1.4.3.6-validate.py schema/v1.4.3.7

      - name: Run candidate integration tests
        run: python schema/v1.4.3.7/tests/integration/test_v1_4_3_7.py

      - name: Test Skill scaffold
        run: python -m unittest discover -s tests/unit -v

      - name: Compile candidate Python tools
        run: python -m compileall -q schema/v1.4.3.7/tools
