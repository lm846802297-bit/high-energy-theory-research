name: RC-001 dimension-six soft-loop cross-check

on:
  push:
    branches:
      - research/rc-001-uv-eft-difference-v13
    paths:
      - calculations/RC-001-dim6-soft-loop-crosscheck.py
      - validation/RC-001-dim6-soft-loop-crosscheck.txt
      - .github/workflows/rc001-dim6-soft-loop-crosscheck.yml
  pull_request:
    paths:
      - calculations/RC-001-dim6-soft-loop-crosscheck.py
      - validation/RC-001-dim6-soft-loop-crosscheck.txt
      - .github/workflows/rc001-dim6-soft-loop-crosscheck.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-symbolic-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned symbolic dependency
        run: python -m pip install --disable-pip-version-check sympy==1.14.0
      - name: Run exact symbolic checks
        run: python calculations/RC-001-dim6-soft-loop-crosscheck.py > /tmp/rc001-dim6-soft-loop-crosscheck.txt
      - name: Compare run with checked-in evidence
        run: diff -u validation/RC-001-dim6-soft-loop-crosscheck.txt /tmp/rc001-dim6-soft-loop-crosscheck.txt
